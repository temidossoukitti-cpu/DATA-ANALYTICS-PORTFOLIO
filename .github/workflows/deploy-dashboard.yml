name: Deploy Finance Dashboard

on:
  push:
    branches: [main]
    paths:
      - "projects/project-1-budget-vs-actual/dashboard-web/**"
      - ".github/workflows/deploy-dashboard.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/project-1-budget-vs-actual/dashboard-web
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: projects/project-1-budget-vs-actual/dashboard-web/pnpm-lock.yaml
      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile
      - name: Construire le dashboard
        run: pnpm run build
        env:
          GITHUB_ACTIONS: true
      - name: Préparer GitHub Pages
        uses: actions/configure-pages@v5
      - name: Charger l’artefact Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: projects/project-1-budget-vs-actual/dashboard-web/dist/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publier sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
